<!DOCTYPE html>
<html lang="en" style="height:100%">
<head><meta charset="utf-8"><title>nanobox — node18 patience test</title>
<style>html,body{height:100%;margin:0;background:#0b0a09;color:#e8e2da;font-family:ui-monospace,monospace}
#status{padding:8px 12px;color:#D97757;font-size:13px}#console{height:calc(100% - 40px);margin:0;padding:8px 12px;font-size:12.5px;white-space:pre-wrap;overflow:auto}</style></head>
<body>
<div id="status">loading…</div><pre id="console"></pre>
<script type="module">
const status = document.getElementById("status"), consoleEl = document.getElementById("console");
const log = (s) => { status.textContent = s; };
const SCRIPT = [
  "echo ===NODEPROBE===",
  "chmod +x /data/node",
  "echo 'cp cli.js 9MB (throughput probe):'",
  "S=$(date +%s); cp /data/cli.js /root/cli.js; echo cli_cp_t=$(( $(date +%s) - S ))s size=$(stat -c%s /root/cli.js 2>/dev/null)",
  "echo 'cp node 83MB from DataDevice to ext2 /root:'",
  "S=$(date +%s); cp /data/node /root/node; echo node_cp_t=$(( $(date +%s) - S ))s; chmod +x /root/node",
  "echo 'node18 --version FROM EXT2 (120s cap):'",
  "S=$(date +%s); timeout 120 /root/node --version 2>&1; echo node_exit=$? t=$(( $(date +%s) - S ))s",
  "echo ===NODEPROBE_DONE==="
].join("\n");
async function fetchBytes(u) { const r = await fetch(u); if (!r.ok) throw new Error(u + " -> " + r.status); return new Uint8Array(await r.arrayBuffer()); }
try {
  const CheerpX = await import("https://cxrtnc.leaningtech.com/1.2.8/cx.esm.js");
  log("devices…");
  const cloud = await CheerpX.CloudDevice.create("wss://disks.webvm.io/debian_large_20230522_5044875331.ext2");
  const idb = await CheerpX.IDBDevice.create("nanobox-blocks");
  const overlay = await CheerpX.OverlayDevice.create(cloud, idb);
  const data = await CheerpX.DataDevice.create();
  log("booting…");
  const cx = await CheerpX.Linux.create({ mounts: [
    { type: "ext2", path: "/", dev: overlay },
    { type: "dir", path: "/data", dev: data },
    { type: "devs", path: "/dev" }, { type: "proc", path: "/proc" } ] });
  cx.setConsole(consoleEl);
  window.__cx = cx; window.__data = data;
  log("fetching node18 + cli.js…");
  const [nodeBytes, cliBytes] = await Promise.all([
    fetchBytes("payload/node/bin/node"),
    fetchBytes("payload/claudejs/node_modules/@anthropic-ai/claude-code/cli.js"),
  ]);
  log("writing into VM…");
  await data.writeFile("/node", nodeBytes);
  await data.writeFile("/cli.js", cliBytes);
  log("running node18 --version (patience)…");
  const code = await cx.run("/bin/bash", ["-c", SCRIPT], {
    env: ["HOME=/root", "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin", "LANG=C", "LC_ALL=C"],
    cwd: "/root", uid: 0, gid: 0 });
  log("done exit " + code);
  window.__vmprobe = { code, text: consoleEl.textContent };
} catch (e) { log("ERROR: " + (e && e.message || e)); window.__vmerror = String(e && e.stack || e); consoleEl.textContent += "\n[err] " + (e && e.stack || e); }
</script>
</body></html>
