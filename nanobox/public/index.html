<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>nanobox</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: ui-sans-serif, system-ui, sans-serif; background: #0d0b0a; color: #e8e2da; }
  header { padding: 22px 20px 10px; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid #241f1b; }
  header svg { flex: none; }
  header h1 { font-size: 20px; margin: 0; } header .accent { color: #D97757; }
  header p { margin: 2px 0 0; color: #9c9187; font-size: 13px; }
  main { display: grid; grid-template-columns: 320px 1fr; gap: 0; height: calc(100vh - 74px); }
  aside { border-right: 1px solid #241f1b; padding: 16px; overflow-y: auto; }
  .panel { padding: 16px; overflow-y: auto; }
  button { background: #D97757; color: #180f0b; border: 0; padding: 9px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 13px; }
  button.ghost { background: #1c1815; color: #d8cfc4; border: 1px solid #362e28; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #8a8078; margin: 18px 0 8px; }
  .mount { display: flex; justify-content: space-between; align-items: center; padding: 9px 11px; background: #161311; border: 1px solid #2a2420; border-radius: 8px; margin-bottom: 7px; }
  .mount .vp { font-family: ui-monospace, monospace; font-size: 12.5px; color: #e8e2da; }
  .mount .lbl { color: #9c9187; font-size: 11.5px; }
  .mount.home { border-color: #4a3a30; }
  .warn { color: #e0b23a; font-size: 12.5px; }
  #log { font-family: ui-monospace, monospace; font-size: 12px; color: #b7ada2; white-space: pre-wrap; line-height: 1.6; }
  .row { display: flex; gap: 8px; align-items: center; margin: 8px 0; }
  input, select { background: #120f0d; border: 1px solid #362e28; color: #e8e2da; border-radius: 7px; padding: 7px 9px; font-size: 13px; }
  code { color: #D97757; }
  .unsupported { padding: 40px; text-align: center; color: #e08a7a; }
</style>
</head>
<body>
  <header>
    <svg viewBox="0 0 120 120" width="40" height="40" aria-label="Claude">
      <g fill="#D97757">
        <rect x="56.5" y="6" width="7" height="38" rx="3.5" transform="rotate(0 60 60)"/>
        <rect x="57.5" y="16" width="5" height="26" rx="2.5" transform="rotate(30 60 60)"/>
        <rect x="56.5" y="6" width="7" height="38" rx="3.5" transform="rotate(60 60 60)"/>
        <rect x="57.5" y="16" width="5" height="26" rx="2.5" transform="rotate(90 60 60)"/>
        <rect x="56.5" y="6" width="7" height="38" rx="3.5" transform="rotate(120 60 60)"/>
        <rect x="57.5" y="16" width="5" height="26" rx="2.5" transform="rotate(150 60 60)"/>
        <rect x="56.5" y="6" width="7" height="38" rx="3.5" transform="rotate(180 60 60)"/>
        <rect x="57.5" y="16" width="5" height="26" rx="2.5" transform="rotate(210 60 60)"/>
        <rect x="56.5" y="6" width="7" height="38" rx="3.5" transform="rotate(240 60 60)"/>
        <rect x="57.5" y="16" width="5" height="26" rx="2.5" transform="rotate(270 60 60)"/>
        <rect x="56.5" y="6" width="7" height="38" rx="3.5" transform="rotate(300 60 60)"/>
        <rect x="57.5" y="16" width="5" height="26" rx="2.5" transform="rotate(330 60 60)"/>
      </g>
    </svg>
    <div>
      <h1><span class="accent">nanobox</span></h1>
      <p>Pick a folder → it becomes your VM home. Add mounts. The table lives in home.</p>
    </div>
  </header>

  <div id="app"></div>

  <template id="main-tpl">
    <main>
      <aside>
        <button id="pick-home">Pick home folder…</button>
        <h2>Mounts</h2>
        <div id="mounts"></div>
        <div id="add-area" style="display:none">
          <h2>Add a mount</h2>
          <div class="row"><input id="mount-path" placeholder="/mnt/projects" style="flex:1" /></div>
          <div class="row"><button id="add-mount" class="ghost">Pick folder for this path…</button></div>
        </div>
        <div id="repick" class="warn"></div>
      </aside>
      <div class="panel">
        <h2>Activity</h2>
        <div id="log"></div>
      </div>
    </main>
  </template>

  <script type="module" src="./app.js"></script>
</body>
</html>
