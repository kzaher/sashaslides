<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>parallel search benchmark</title>
<style>body{font-family:ui-monospace,monospace;background:#0d0b0a;color:#e8e2da;padding:24px;font-size:13px}
table{border-collapse:collapse;margin-top:12px}td,th{border:1px solid #2c2621;padding:6px 12px;text-align:right}
th{color:#D97757}.accent{color:#D97757}h1{font-size:16px}</style></head>
<body>
<h1>parallel search (rg-core) — Web Workers over a read-only SharedArrayBuffer</h1>
<div id="status">building corpus…</div>
<div id="out"></div>
<script type="module">
const MiB = 1024 * 1024;
const CORPUS = 256 * MiB;   // bytes scanned per pass
const PAD = 16;
const NEEDLE = new TextEncoder().encode("NEEDLE");
const status = document.getElementById("status");
const out = document.getElementById("out");

if (!self.crossOriginIsolated) { status.textContent = "NOT crossOriginIsolated — SAB unavailable. Serve with COOP/COEP."; throw new Error("no SAB"); }

// --- build an immutable corpus in a SharedArrayBuffer ---
const sab = new SharedArrayBuffer(CORPUS + PAD);
const buf = new Uint8Array(sab);
(() => {
  const block = new Uint8Array(65536);
  const line = new TextEncoder().encode("2026-08-13T00:00:00Z INFO service=api req=GET /v1/things status=200 latency=12ms trace=abc123 msg=ok\n");
  let o = 0;
  while (o + line.length < block.length) { block.set(line, o); o += line.length; }
  // sprinkle the needle a few times per block (deterministic, low match rate)
  for (const pos of [1024, 17000, 33000, 49000]) block.set(NEEDLE, pos);
  buf.set(block, 0);
  let filled = block.length;
  while (filled < CORPUS) { const n = Math.min(filled, CORPUS - filled); buf.copyWithin(filled, 0, n); filled += n; }
})();

const HC = navigator.hardwareConcurrency || 4;
const MAX = Math.min(HC * 2, 16);

// --- worker pool ---
const pool = [];
const waiters = new Map();
let seq = 0;
function makeWorker() {
  const w = new Worker("./search-worker.js");
  w.onmessage = (e) => { const m = e.data; if (m.type === "result") { const r = waiters.get(m.id); waiters.delete(m.id); r(m); } };
  return w;
}
function ready(w) { return new Promise((res) => { const h = (e) => { if (e.data.type === "ready") { w.removeEventListener("message", h); res(); } }; w.addEventListener("message", h); }); }
async function initPool(n) {
  while (pool.length < n) { const w = makeWorker(); const r = ready(w); w.postMessage({ type: "init", sab, needle: NEEDLE }); await r; pool.push(w); }
}
function dispatch(w, start, end) { const id = ++seq; return new Promise((res) => { waiters.set(id, res); w.postMessage({ type: "search", id, start, end }); }); }

async function runConfig(k, reps) {
  const ranges = [];
  for (let i = 0; i < k; i++) ranges.push([Math.floor(i * CORPUS / k), Math.floor((i + 1) * CORPUS / k)]);
  let best = Infinity, count = 0, maxWorkerMs = 0;
  for (let r = 0; r < reps + 1; r++) {           // r=0 is warmup, not timed
    const t0 = performance.now();
    const results = await Promise.all(ranges.map((rg, i) => dispatch(pool[i], rg[0], rg[1])));
    const wall = performance.now() - t0;
    if (r === 0) { count = results.reduce((a, b) => a + b.count, 0); continue; }
    count = results.reduce((a, b) => a + b.count, 0);
    maxWorkerMs = Math.max(...results.map((x) => x.ms));
    best = Math.min(best, wall);
  }
  return { k, ms: best, count, maxWorkerMs };
}

async function main() {
  await initPool(MAX);
  status.textContent = `corpus ${CORPUS / MiB} MiB · hardwareConcurrency=${HC} · pool=${MAX} · crossOriginIsolated=${self.crossOriginIsolated}`;
  const configs = [...new Set([1, 2, 3, 4, 6, 8, HC, MAX])].filter((k) => k >= 1 && k <= MAX).sort((a, b) => a - b);
  const rows = [];
  let base = null;
  for (const k of configs) {
    const res = await runConfig(k, 5);
    if (k === 1) base = res.ms;
    rows.push({ ...res, speedup: base / res.ms, gbps: (CORPUS / MiB / 1024) / (res.ms / 1000) });
  }
  const allSame = rows.every((r) => r.count === rows[0].count);
  window.__bench = { corpusMiB: CORPUS / MiB, HC, crossOriginIsolated: self.crossOriginIsolated, matchCount: rows[0].count, countsConsistent: allSame, rows };
  out.innerHTML = "<table><tr><th>workers</th><th>wall ms (best)</th><th>speedup×</th><th>throughput GiB/s</th><th>matches</th></tr>" +
    rows.map((r) => `<tr><td>${r.k}</td><td>${r.ms.toFixed(1)}</td><td class="accent">${r.speedup.toFixed(2)}</td><td>${r.gbps.toFixed(2)}</td><td>${r.count}</td></tr>`).join("") +
    `</table><p>counts consistent across configs: <b>${allSame}</b></p>`;
  status.textContent += " — done";
}
main();
</script>
</body>
</html>
