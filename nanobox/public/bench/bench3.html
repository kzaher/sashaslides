<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>bench3 — same corpus as native</title>
<style>body{font-family:ui-monospace,monospace;background:#0d0b0a;color:#e8e2da;padding:20px;font-size:13px}</style></head>
<body><div id="status">loading corpus.bin…</div>
<script type="module">
const status = document.getElementById("status");
if (!self.crossOriginIsolated) { status.textContent = "no SAB"; throw new Error("no SAB"); }
const NEEDLE = new TextEncoder().encode("NEEDLE");

// Load the EXACT file the native tools searched.
const ab = await (await fetch("./corpus.bin")).arrayBuffer();
const CORPUS = ab.byteLength, PAD = 16;
const sab = new SharedArrayBuffer(CORPUS + PAD);
new Uint8Array(sab).set(new Uint8Array(ab));
const ctrlSab = new SharedArrayBuffer(4);
const ctrl = new Int32Array(ctrlSab);

const HC = navigator.hardwareConcurrency || 4;
const MAX = HC;                       // <-- pool sized to DETECTED cores
const chunkSize = 512 * 1024, numChunks = Math.ceil(CORPUS / chunkSize);

const pool = []; const waiters = new Map(); let seq = 0;
function ready(w){ return new Promise(r=>{ const h=e=>{ if(e.data.type==="ready"){ w.removeEventListener("message",h); r(); } }; w.addEventListener("message",h); }); }
async function initPool(n){
  while(pool.length<n){
    const w=new Worker("./search-worker2.js");
    w.onmessage=e=>{ const m=e.data; if(m.type==="result"){ const r=waiters.get(m.id); waiters.delete(m.id); r(m); } };
    const r=ready(w);
    w.postMessage({type:"init", sab, needle:NEEDLE, ctrlSab, chunkSize, numChunks, corpus:CORPUS});
    await r; pool.push(w);
  }
}
const send=(w,msg)=>{ const id=++seq; msg.id=id; return new Promise(res=>{ waiters.set(id,res); w.postMessage(msg); }); };

async function runStatic(k, reps){
  const ranges=[]; for(let i=0;i<k;i++) ranges.push([Math.floor(i*CORPUS/k), Math.floor((i+1)*CORPUS/k)]);
  let best=Infinity, count=0;
  for(let r=0;r<reps+1;r++){ const t0=performance.now();
    const rs=await Promise.all(ranges.map((rg,i)=>send(pool[i],{type:"range",start:rg[0],end:rg[1]})));
    const wall=performance.now()-t0; count=rs.reduce((a,b)=>a+b.count,0); if(r>0) best=Math.min(best,wall); }
  return {k, ms:best, count};
}
async function runDynamic(k, reps){
  let best=Infinity, count=0;
  for(let r=0;r<reps+1;r++){ Atomics.store(ctrl,0,0); const t0=performance.now();
    const rs=await Promise.all(Array.from({length:k},(_,i)=>send(pool[i],{type:"go"})));
    const wall=performance.now()-t0; count=rs.reduce((a,b)=>a+b.count,0); if(r>0) best=Math.min(best,wall); }
  return {k, ms:best, count};
}

async function main(){
  await initPool(MAX);
  status.textContent = `corpus ${(CORPUS/1048576)|0} MiB · HC=${HC} · pool=${MAX}`;
  const configs=[...new Set([1,2,4,8,HC])].filter(k=>k>=1&&k<=MAX).sort((a,b)=>a-b);
  const rows=[]; let baseS=null, baseD=null;
  for(const k of configs){
    const s=await runStatic(k,5); if(k===1) baseS=s.ms;
    const d=await runDynamic(k,5); if(k===1) baseD=d.ms;
    rows.push({k, staticMs:s.ms, staticSpeedup:baseS/s.ms, dynMs:d.ms, dynSpeedup:baseD/d.ms, count:s.count, dcount:d.count});
  }
  window.__bench3 = { corpusMiB: CORPUS/1048576, HC, gib1static: (CORPUS/1073741824)/(baseS/1000), rows, ok: rows.every(r=>r.count===16384&&r.dcount===16384) };
  status.textContent += " — done";
}
main();
</script></body></html>
