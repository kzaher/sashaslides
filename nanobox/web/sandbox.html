<script>
// The guest's network egress ends in a plain fetch from this page (container2wasm's stack worker):
// web/proxyext.js routes every cross-origin request — through the nanobox proxy extension when it is
// installed (detected below, before anything starts), else through the /net/fetch relay for the
// vendors that don't answer CORS (web/netpolicy.js) and directly for the rest. Every response is
// counted per host and route (window.nanoboxNet).
window.nanoboxNet = { requests: [], routes: {}, extension: null };
(() => {
  const origFetch = window.fetch.bind(window);
  const count = (rec, r) => {
    rec.status = r.status;
    const len = Number(r.headers.get("content-length")) || 0;
    if (len || !r.body) { rec.bytes = len; return r; }
    const counted = r.body.pipeThrough(new TransformStream({ transform(c, ctl) { rec.bytes += c.byteLength; ctl.enqueue(c); } }));
    return new Response(counted, { status: r.status, statusText: r.statusText, headers: r.headers });
  };
  window.fetch = (input, init = {}) => {
    const url = typeof input === "string" ? input : input instanceof URL ? input.href : input.url;
    let target; try { target = new URL(url, location.href); } catch { return origFetch(input, init); }
    const method = (init.method || (typeof input === "object" && !(input instanceof URL) && input.method) || "GET").toUpperCase();
    if (target.origin === location.origin || !/^https?:$/.test(target.protocol)) {
      const rec = { url: target.href, method, via: "origin", bytes: 0 }; window.nanoboxNet.requests.push(rec);
      return origFetch(input, init).then((r) => count(rec, r));

    const rec = { url: target.href, method, via: "direct", host: target.hostname, bytes: 0 }; window.nanoboxNet.requests.push(rec);
    return NanoboxProxy.workerFetch(origFetch, input, init, { extension: !!window.nanoboxNet.extension, onRoute: ({ route }) => { rec.via = route === "relay" ? "relay" : route; window.nanoboxNet.routes[route] = (window.nanoboxNet.routes[route] || 0) + 1; } }).then((r) => count(rec, r));
  };
})();

      if (d.event === "persist-applied") ph.persistMs = now();

    bundleFiles: onV8 ? [{ name: "nb/node", url: new URL("/native/nbnode", location.href).href, mode: 0o755 }] : [],

    NanoboxProxy.bridgeWorker(worker);

    worker.onerror = (e) => log("worker-error", { message: e.message });

      cliPath: cli === "claude-native" ? "/usr/local/lib/claude-native/cli.js" : "/usr/local/lib/node_modules/@anthropic-ai/claude-code/cli.js",   // fallback only: argv[1] from HELLO wins
      persistPort: rtChan.port2, cols: xterm.cols, rows: xterm.rows, env: {}, noCache, skipNodeLayer: true, proxyExtension: !!window.nanoboxNet.extension,
    } }, [rtChan.port2]);

}
// ---- extra terminals: terminal.html?sb=<id> tabs talk to this page over a BroadcastChannel; this page
// relays to the runtime worker, which spawns a login shell on a pty in the same guest (claude sandbox) ----
const persist = { kind: "?", writes: 0, bytes: 0, errors: 0, last: 0 };
function updatePersistFooter() { const e = el("persist"); if (!e) return; e.textContent = `state: ${persist.kind}${persist.kind === "opfs" ? "" : persist.kind === "cache" ? " (Cache API fallback)" : ""} · ${persist.writes} saves${persist.errors ? " · " + persist.errors + " FAILED" : ""}`; e.style.color = persist.errors ? "#e5484d" : "#9c9187"; }
const SB_ID = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2));
const termChan = new BroadcastChannel("nanobox-term-" + SB_ID);
termChan.onmessage = (m) => { const d = m.data; if (!d || !worker) return; if (d.type === "term-open" || d.type === "term-in" || d.type === "term-close") worker.postMessage(d); };

    const { type, ...rest } = d;
    log("worker:" + d.event, rest);

    if (d.event === "bundle-loaded") { ph.bundleMs = d.ms; ph.runStartMs = now(); el("status").textContent = "running " + cli; }
    if (d.event === "missing") missing.push(rest);
    if (d.event === "fatal" || d.event === "bundle-error") fail(d.event + ": " + (d.message || "").slice(0, 200));
    if (d.event === "exit") { exitCode = d.code; el("status").textContent = "exited with code " + d.code; if (ph.signinMs == null) fail("exited with code " + d.code); }

}
// which build the page is running — the banner and the footer say it, because ?cli=claude and
// ?cli=claude-native look identical on screen: the npm build is pinned at 2.1.112 (the last release
// whose bin is cli.js), the native one is whatever downloads.claude.ai/…/latest resolved to.
function buildLabel() {
  if (!onV8) return "";
  const p = install && install.list && install.list.find((x) => x.cli === cli);
  const version = p ? p.version : cli === "claude" ? "2.1.112" : "…";

function updateEngineFooter() { el("engine").textContent = `sandbox: ${image} in the VM + first-run installer (${installList.join(", ")}) → ${cli}${buildLabel()}`; }
async function boot() {

  window.nanoboxNet.extension = await NanoboxProxy.detect();
  log("boot", { cli, install: installList, noCache, proxyExtension: window.nanoboxNet.extension });

boot();
