<script>
// The guest's network egress ends in a plain fetch from this page (container2wasm's stack worker):
// web/proxyext.js routes every cross-origin request — through the nanobox proxy extension when it is
// installed (detected below, before anything starts), else through the /net/fetch relay for the
// vendors that don't answer CORS (web/netpolicy.js) and directly for the rest. Every response is
// counted per host and route (window.nanoboxNet).
window.nanoboxNet = { requests: [], routes: {}, extension: null };
(() => {
  const origFetch = window.fetch.bind(window);
  const count = (rec, r) => {
    rec.status = r.status;
    const len = Number(r.headers.get("content-length")) || 0;
    if (len || !r.body) { rec.bytes = len; return r; }
    const counted = r.body.pipeThrough(new TransformStream({ transform(c, ctl) { rec.bytes += c.byteLength; ctl.enqueue(c); } }));
    return new Response(counted, { status: r.status, statusText: r.statusText, headers: r.headers });
  };
  window.fetch = (input, init = {}) => {
    const url = typeof input === "string" ? input : input instanceof URL ? input.href : input.url;
    let target; try { target = new URL(url, location.href); } catch { return origFetch(input, init); }
    const method = (init.method || (typeof input === "object" && !(input instanceof URL) && input.method) || "GET").toUpperCase();
    if (target.origin === location.origin || !/^https?:$/.test(target.protocol)) {
      const rec = { url: target.href, method, via: "origin", bytes: 0 }; window.nanoboxNet.requests.push(rec);
      return origFetch(input, init).then((r) => count(rec, r));
    }
    const rec = { url: target.href, method, via: "direct", host: target.hostname, bytes: 0 }; window.nanoboxNet.requests.push(rec);
    return NanoboxProxy.workerFetch(origFetch, input, init, { extension: !!window.nanoboxNet.extension, onRoute: ({ route }) => { rec.via = route === "relay" ? "relay" : route; window.nanoboxNet.routes[route] = (window.nanoboxNet.routes[route] || 0) + 1; } }).then((r) => count(rec, r));
  };
})();
</script>

<script>
// The sandbox: the smallest Linux (image linux-base: busybox + glibc + libstdc++, no node, no CLI)
// boots in the emulated VM while the FIRST-RUN INSTALLER (web/native/installer.js — the persist
// worker) fetches node + npm + the requested CLIs from the vendors' servers (npm registry directly;
// the agy manifest/tarball through the /net/fetch relay), verifies them and hands the unpacked
// packages to the VM worker (web/sandbox-worker.js = opt-worker.js + a writable bundle/persist
// subtree) — the guest sees them under /usr/local (bind mounts of the persistent tree over
// /usr/local, /root, /home, /var). The tree persists in OPFS and is shared by every page on this
// origin: the second visit downloads nothing, and what the CLIs write (~/.claude, ~/.codex, …) is
// journaled back and survives reloads.
//   claude and claude-native run as JavaScript on this browser's V8 (the runtime worker behind the
//   guest-side node shim, backend #2 of docs/claude-native.md, spec config-vm.json: PATH=/bundle/nb
//   first); codex and agy are x86-64 Linux binaries and run in the guest (spec config-persist.json:
//   the real node in PATH).
//     claude        = the npm build @anthropic-ai/claude-code@2.1.112 (the last one that runs on node)
//     claude-native = the CURRENT release, extracted from the vendor's Bun standalone binary
//                     (downloads.claude.ai, range-fetched tail; docs/sandbox.md)
// Query string:
//   cli=claude|claude-native|codex|agy   what to start (default claude)
//   install=claude,codex,agy   what to install/mount (default: the cli; node + npm always)
//   verifyfull=1               claude-native: download the WHOLE 324 MB binary and check its sha256
//   image=linux-base   jit=L:T   cache=0 (bypass the engine/image caches; re-download the packages too)
//   jitfast=1  load the JIT cache in parallel with the engine download (memoized engine tag)
//   reset=1  wipe the persistent tree first (a true first run)   engine=slim|full (default slim)
//   sharp=1  also install claude's optional @img/sharp-linux-x64 + libvips   auto=0  no prompt auto-answer
//   env=K=V,K=V  extra environment for the CLI
//   shell=1                    SPLIT VIEW: the CLI on the left, an interactive /bin/sh -l on the SAME
//                              guest on the right (draggable divider). Off by default — it adds
//                              /dev/hvc1 + a background shim process to the codex/agy guest, which
//                              would perturb the plain boot path every measurement and e2e test uses.
//                              For claude/claude-native the shell rides the runtime worker that is

const qs = new URLSearchParams(location.search);

// claude and claude-native both run on this browser's V8 through the guest-side node shim

const auto = qs.get("auto") !== "0";
const noCache = qs.get("cache") === "0";
const el = (id) => document.getElementById(id);
const T0 = performance.now();
const now = () => performance.now() - T0;
const SIGNIN = {
  claude: /sign in|log in|claude\.ai\/oauth|authenticate|subscription|api key|browser didn't open/i,
  "claude-native": /sign in|log in|claude\.ai\/oauth|authenticate|subscription|api key|browser didn't open/i,
  codex:  /sign in|log in|chatgpt|api key|authenticate|auth\.openai/i,

let failed = false, exitCode = null;
const events = [], missing = [];

let install = null;   // the persist worker's summary (packages, downloads, store)
let persistWorker = null; const persistLog = [];

}
const xterm = new Terminal({ fontSize: 12, convertEol: false, scrollback: 2000, theme: { background: "#0d0b0a", foreground: "#e8e2da" }, allowProposedApi: true });
const fit = new FitAddon.FitAddon();

// the "guest booted, CLI exec'd" mark: the command is wrapped in `sh -c 'printf "\e]777;nb-booted\a"; exec …'`

const hud = qs.get("hud") === "1" ? Object.assign(document.createElement("span"), { id: "lag", textContent: "key\u2192screen —" }) : null;
if (hud) document.querySelector("footer").appendChild(hud);
let pagesWaiter = null, jitExportWaiter = null, vmWorkerRef = null;

  xterm, engine: "sandbox", image, cli, install: installList, events, missing, phases: ph, perf,
  get signinMs() { return ph.signinMs; }, get failed() { return failed; }, get runStartMs() { return ph.runStartMs; }, get exitCode() { return exitCode; }, get installInfo() { return install; },
  screen() { const b = xterm.buffer.active, out = []; for (let i = 0; i < b.length; i++) out.push(b.getLine(i).translateToString(true)); return out.join("\n"); },
  send(data) { xterm._core.coreService.triggerDataEvent(data, true); },   // into the VM's tty, like a user typing

  exportJit(name) {

      .then(async (d) => {
        if (!d || d.error || !d.bytes) return { error: (d && d.error) || "no bundle" };

  pages() { return new Promise((res) => { if (!vmWorkerRef) return res(null); pagesWaiter = res; vmWorkerRef.postMessage({ type: "pages" }); }); },
  dump() { return new Promise((res) => { if (!worker) return res(null); lastMissing = res; worker.postMessage({ type: "dump" }); }); },
  eval(code) { const id = ++evalId; return new Promise((res, rej) => { evals.set(id, { res, rej }); worker.postMessage({ type: "eval", id, code }); }); },

  if (ph.imageMs != null) p.push(`image ${fmt(ph.imageMs)}`);
  if (ph.installMs != null) p.push(`install ${fmt(ph.installMs)}${install ? (install.fromCache === install.packages ? " (cached)" : ` (${(install.downloadBytes / 1e6).toFixed(0)} MB)`) : ""}`);
  if (ph.vmStartMs != null) p.push(`vm start ${fmt(ph.vmStartMs)}`);

setInterval(() => { if (ph.signinMs == null && !failed) timerEl.textContent = fmt(now()); el("phases").textContent = phasesText(); }, 100);
const answered = new Set();
setInterval(() => {
  if (ph.signinMs != null || failed) return;
  const s = window.nanobox.screen();
  if (auto && onV8) for (const p of PROMPTS) if (!answered.has(p.name) && p.when.test(s)) { answered.add(p.name); log("prompt", { name: p.name }); window.nanobox.send(p.send); return; }
  if (SIGNIN[cli] && SIGNIN[cli].test(s)) {

    const boot = ph.bootMs != null ? ph.bootMs : ph.helloMs;
    timerEl.textContent = fmt(ph.signinMs) + (ph.vmStartMs != null && boot != null ? ` (load ${fmt(ph.vmStartMs)} + boot ${fmt(boot - ph.vmStartMs)} + run ${fmt(ph.signinMs - boot)})` : ""); timerEl.className = "done";
    el("status").textContent = "sign-in screen reached";
    log("signin", { ms: Math.round(ph.signinMs), loadMs: ph.vmStartMs != null ? Math.round(ph.vmStartMs) : null, bootMs: boot != null ? Math.round(boot - ph.vmStartMs) : null, runMs: boot != null ? Math.round(ph.signinMs - boot) : null });
  }
}, 250);
const say = (s) => xterm.write(s.replace(/\n/g, "\r\n"));
const fail = (msg) => { failed = true; timerEl.className = "err"; el("status").textContent = msg; log("error", { message: String(msg) }); };

// ---- the persist worker: opens the persistent tree (OPFS), installs what is missing from the vendors,
// hands the packages + journals to the VM worker (and claude's to the runtime worker) over MessageChannels,
// then keeps journaling the guest's writes that the VM worker sends back ----
const vmChan = new MessageChannel(), rtChan = new MessageChannel();

  persistWorker = w; NanoboxProxy.bridgeWorker(w);

    const d = m.data; if (!d) return;
    if (d.type === "progress") {

      // persistence health: what store, and every journal write/failure — to the footer and the server log
      if (d.stage === "store") { persist.kind = d.kind; if (window.NanoboxReport) NanoboxReport.event("persist-store", { kind: d.kind }); }
      if (d.stage === "journal") { persist.writes++; persist.bytes += d.bytes || 0; persist.last = Date.now(); }
      if (d.stage === "journal-error") { persist.errors++; if (window.NanoboxReport) NanoboxReport.event("persist-journal-error", { message: d.message }); }

      if (d.stage === "fetched") el("status").textContent = `installing: ${(d.bytes / 1e6).toFixed(1)} MB from ${new URL(d.url).hostname}`;
      return;

      perf.installer = { downloads: d.stats.downloads, resources: d.resources };
      updateEngineFooter();   // the resolved version of the running build (claude-native: whatever /latest said)
      log("installed", { ms: d.ms, store: d.store, packages: d.packages.length, fromCache: d.stats.fromCache, downloadBytes: install.downloadBytes, journals: d.journals });

// ---- the VM (opt-worker.js via sandbox-worker.js, direct rootfs, guest-side node shim) ----

// ---- extra terminals: terminal.html?sb=<id> tabs talk to this page over a BroadcastChannel; this page

// ---- the SPLIT view (?shell=1): a second xterm in this page, on a pty in the SAME guest ----
