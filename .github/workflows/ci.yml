name: CI

on:
  pull_request:
  push:
    branches: [nanobot, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Sashaslides (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - name: Build devcontainer and run CI
        uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/ci/devcontainer.json
          push: never
          runCmd: |
            npm ci
            python3 -m pip install -r requirements.txt
            python3 -m grpc_tools.protoc -I. --python_out=. --pyi_out=. proto/sashaslides.proto
            npm run typecheck
            npm run renderer:build
            npm ci --prefix structured-prompting
            npm run typecheck --prefix structured-prompting
            npm run build --prefix structured-prompting -- example/main-scaffolding.ts
            npm test --prefix structured-prompting
            npm ci --prefix sashaslides/claude-composer
            npm run build --prefix sashaslides/claude-composer
            npm test --prefix sashaslides/claude-composer
            python3 -m mypy sashaslides
            python3 -m pytest
