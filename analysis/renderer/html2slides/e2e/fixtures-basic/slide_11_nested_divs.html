<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1280px; height: 720px; overflow: hidden; background: #f5f5f5; font-family: Arial, sans-serif; display: flex; align-items: center; justify-content: center; }
.l1 { width: 800px; height: 520px; background: #ffffff; border: 2px solid #333; border-radius: 12px; padding: 40px; }
.l2 { width: 100%; height: 100%; background: #eef2ff; border: 2px dashed #6366f1; border-radius: 8px; padding: 30px; }
.l3 { width: 100%; height: 100%; background: #fff; border-radius: 6px; padding: 20px; display: flex; gap: 16px; }
.l4 { flex: 1; background: #fef3c7; border: 1px solid #f59e0b; border-radius: 4px; padding: 14px; display: flex; align-items: center; justify-content: center; }
.l4 .inner { background: #fee2e2; border: 1px solid #ef4444; padding: 10px 16px; border-radius: 4px; font-size: 16px; color: #991b1b; }
</style></head><body>
<div class="l1">
  <div class="l2">
    <div class="l3">
      <div class="l4"><div class="inner">Leaf A</div></div>
      <div class="l4"><div class="inner">Leaf B</div></div>
      <div class="l4"><div class="inner">Leaf C</div></div>
    </div>
  </div>
</div>
</body></html>
