<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1280px; height: 720px; overflow: hidden; background: #f9fafb; font-family: Arial, sans-serif; padding: 60px 80px; }
h2 { font-size: 28px; color: #111; margin-bottom: 24px; }
.features { list-style: none; max-width: 520px; background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 8px 20px; }
.features li { font-size: 16px; color: #374151; padding: 12px 0; border-bottom: 1px solid #f3f4f6; display: flex; align-items: center; gap: 10px; }
.features li:last-child { border-bottom: none; }
.check { color: #10b981; font-weight: 700; font-size: 18px; }
.cross { color: #ef4444; font-weight: 700; font-size: 18px; }
.features li b { color: #111; font-weight: 600; }
</style></head><body>
<h2>Styled feature list</h2>
<ul class="features">
  <li><span class="check">✓</span> <b>Unlimited</b> projects</li>
  <li><span class="check">✓</span> <b>25</b> team members</li>
  <li><span class="check">✓</span> Priority <b>support</b></li>
  <li><span class="cross">✗</span> Custom <b>domains</b></li>
  <li><span class="cross">✗</span> <b>API</b> access</li>
</ul>
</body></html>
