<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1280px; height: 720px; overflow: hidden; background: #fff; font-family: Arial, sans-serif; padding: 40px 60px; }
h2 { font-size: 22px; color: #111; margin-bottom: 12px; }
.row { display: flex; gap: 40px; margin-bottom: 24px; }
.row > div { flex: 1; }
.label { font-size: 13px; color: #6b7280; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
table { font-size: 14px; width: 100%; }
table.sep { border-collapse: separate; border-spacing: 4px; }
table.coll { border-collapse: collapse; }
.sep th, .sep td { background: #eef2ff; padding: 8px 10px; border: 1px solid #6366f1; }
.coll th, .coll td { padding: 8px 10px; border: 2px solid #111; }
.dashed th, .dashed td { padding: 8px 10px; border: 2px dashed #ef4444; }
.mixed { border-collapse: collapse; }
.mixed th { padding: 8px 10px; background: #111; color: #fff; border: none; }
.mixed td { padding: 8px 10px; border-top: 1px solid #e5e7eb; border-bottom: 1px solid #e5e7eb; }
.mixed td:first-child { border-left: 3px solid #10b981; }
.mixed td:last-child { font-weight: 700; color: #059669; }
</style></head><body>
<h2>Table borders variants</h2>
<div class="row">
  <div>
    <div class="label">Separate borders</div>
    <table class="sep">
      <tr><th>A</th><th>B</th><th>C</th></tr>
      <tr><td>1</td><td>2</td><td>3</td></tr>
      <tr><td>4</td><td>5</td><td>6</td></tr>
    </table>
  </div>
  <div>
    <div class="label">Thick collapsed</div>
    <table class="coll">
      <tr><th>X</th><th>Y</th><th>Z</th></tr>
      <tr><td>10</td><td>20</td><td>30</td></tr>
      <tr><td>40</td><td>50</td><td>60</td></tr>
    </table>
  </div>
</div>
<div class="row">
  <div>
    <div class="label">Dashed borders</div>
    <table class="coll dashed">
      <tr><th>P</th><th>Q</th></tr>
      <tr><td>aa</td><td>bb</td></tr>
      <tr><td>cc</td><td>dd</td></tr>
    </table>
  </div>
  <div>
    <div class="label">Per-cell borders</div>
    <table class="mixed">
      <tr><th>Item</th><th>Status</th><th>Value</th></tr>
      <tr><td>Alpha</td><td>OK</td><td>$120</td></tr>
      <tr><td>Beta</td><td>OK</td><td>$340</td></tr>
      <tr><td>Gamma</td><td>OK</td><td>$560</td></tr>
    </table>
  </div>
</div>
</body></html>
