<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1280px; height: 720px; overflow: hidden; background: #fff; font-family: Arial, sans-serif; padding: 60px 80px; }
h2 { font-size: 26px; color: #111; margin-bottom: 20px; }
table { border-collapse: collapse; width: 720px; font-size: 16px; }
th, td { border: 1px solid #333; padding: 10px 14px; text-align: left; }
th { background: #f3f4f6; color: #111; font-weight: 600; }
td { color: #333; }
</style></head><body>
<h2>Basic table (collapsed borders)</h2>
<table>
  <thead>
    <tr><th>Plan</th><th>Users</th><th>Storage</th><th>Price</th></tr>
  </thead>
  <tbody>
    <tr><td>Starter</td><td>5</td><td>10 GB</td><td>$19</td></tr>
    <tr><td>Pro</td><td>25</td><td>100 GB</td><td>$49</td></tr>
    <tr><td>Enterprise</td><td>Unlimited</td><td>1 TB</td><td>$99</td></tr>
  </tbody>
</table>
</body></html>
