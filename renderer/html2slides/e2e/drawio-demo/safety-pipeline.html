<html lang="en">
<head>
<meta charset="utf-8">
<style>

  #slide { width:1280px; height:720px; background:#ffffff; font-family:"Segoe UI",system-ui,Roboto,sans-serif; position:relative; overflow:hidden; }
  /* The drawio source for this rendered diagram — workstream E will lift this
     into an off-canvas text box below the slide (marker fill #FF00FF) so the
     add-on can detect & re-open it for editing. Hidden here so it's not painted. */

<div id="slide">
<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" data-drawio="safety-pipeline">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrowLoop" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9333ea"/>
    </marker>
    <marker id="arrowFail" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eff6ff"/><stop offset="1" stop-color="#dbeafe"/></linearGradient>
    <linearGradient id="gAmber" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffbeb"/><stop offset="1" stop-color="#fef3c7"/></linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ecfdf5"/><stop offset="1" stop-color="#d1fae5"/></linearGradient>
  </defs>

  <!-- title -->
  <text x="640" y="46" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">Safety Pipeline — User-Reported Response Issues → Production Fix</text>
  <text x="640" y="74" text-anchor="middle" font-size="15" fill="#64748b">Report &amp; triage → diagnose &amp; fix → ship &amp; monitor, with a closed feedback loop</text>

  <!-- legend -->
  <g font-size="13" fill="#334155">
    <rect x="372" y="92" width="14" height="14" rx="3" fill="url(#gBlue)" stroke="#3b82f6"/><text x="392" y="104">Report &amp; Triage</text>
    <rect x="520" y="92" width="14" height="14" rx="3" fill="url(#gAmber)" stroke="#d97706"/><text x="540" y="104">Diagnose &amp; Fix</text>
    <rect x="668" y="92" width="14" height="14" rx="3" fill="url(#gGreen)" stroke="#10b981"/><text x="688" y="104">Ship &amp; Monitor</text>
  </g>

  <!-- ===== stage boxes ===== -->
  <!-- row A (top, left→right): report & triage + start of diagnose -->
  <g filter="url(#soft)">
    <rect x="40"   y="150" width="200" height="96" rx="12" fill="url(#gBlue)"  stroke="#3b82f6" stroke-width="2"/>
    <rect x="290"  y="150" width="200" height="96" rx="12" fill="url(#gBlue)"  stroke="#3b82f6" stroke-width="2"/>
    <rect x="540"  y="150" width="200" height="96" rx="12" fill="url(#gBlue)"  stroke="#3b82f6" stroke-width="2"/>
    <rect x="790"  y="150" width="200" height="96" rx="12" fill="url(#gAmber)" stroke="#d97706" stroke-width="2"/>
    <rect x="1040" y="150" width="200" height="96" rx="12" fill="url(#gAmber)" stroke="#d97706" stroke-width="2"/>
  </g>
  <g text-anchor="middle" fill="#0f172a">
    <text x="140"  y="186" font-size="26">🚩</text><text x="140"  y="214" font-size="16" font-weight="700">User flags response</text><text x="140"  y="234" font-size="12.5" fill="#475569">in-product “Report” button</text>
    <text x="390"  y="186" font-size="26">📥</text><text x="390"  y="214" font-size="16" font-weight="700">Intake queue</text><text x="390"  y="234" font-size="12.5" fill="#475569">dedupe · attach context</text>
    <text x="640"  y="186" font-size="26">🧭</text><text x="640"  y="214" font-size="16" font-weight="700">Triage &amp; severity</text><text x="640"  y="234" font-size="12.5" fill="#475569">safety class · priority</text>
    <text x="890"  y="186" font-size="26">🧩</text><text x="890"  y="214" font-size="16" font-weight="700">Cluster reports</text><text x="890"  y="234" font-size="12.5" fill="#475569">group by root cause</text>
    <text x="1140" y="186" font-size="26">🔬</text><text x="1140" y="214" font-size="16" font-weight="700">Reproduce</text><text x="1140" y="234" font-size="12.5" fill="#475569">build failing eval case</text>
  </g>

  <!-- row B (bottom, right→left): fix → ship → monitor -->
  <g filter="url(#soft)">
    <rect x="1040" y="430" width="200" height="96" rx="12" fill="url(#gAmber)" stroke="#d97706" stroke-width="2"/>
    <!-- Verify is a decision diamond -->
    <polygon points="890,418 1000,478 890,538 780,478" fill="url(#gAmber)" stroke="#d97706" stroke-width="2"/>
    <rect x="440"  y="430" width="200" height="96" rx="12" fill="url(#gGreen)" stroke="#10b981" stroke-width="2"/>
    <rect x="240"  y="430" width="170" height="96" rx="12" fill="url(#gGreen)" stroke="#10b981" stroke-width="2"/>
    <rect x="40"   y="430" width="170" height="96" rx="12" fill="url(#gGreen)" stroke="#10b981" stroke-width="2"/>
  </g>
  <g text-anchor="middle" fill="#0f172a">
    <text x="1140" y="466" font-size="26">🛠️</text><text x="1140" y="494" font-size="16" font-weight="700">Develop fixes</text><text x="1140" y="514" font-size="12.5" fill="#475569">parallel candidates</text>
    <text x="890"  y="474" font-size="22">✅</text><text x="890"  y="498" font-size="15" font-weight="700">Verify</text><text x="890" y="516" font-size="11.5" fill="#475569">auto-eval · red-team</text>
    <text x="540"  y="466" font-size="26">🐤</text><text x="540"  y="494" font-size="16" font-weight="700">Stage / canary</text><text x="540"  y="514" font-size="12.5" fill="#475569">gated rollout %</text>
    <text x="325"  y="466" font-size="24">🚀</text><text x="325"  y="494" font-size="15" font-weight="700">Deploy to prod</text><text x="325"  y="514" font-size="12" fill="#475569">versioned release</text>
    <text x="125"  y="466" font-size="24">📈</text><text x="125"  y="494" font-size="15" font-weight="700">Monitor</text><text x="125"  y="514" font-size="12" fill="#475569">metrics · alerts</text>
  </g>

  <!-- ===== connectors ===== -->
  <g fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)">
    <!-- row A chain -->
    <path d="M240,198 L286,198"/>
    <path d="M490,198 L536,198"/>
    <path d="M740,198 L786,198"/>
    <path d="M990,198 L1036,198"/>
    <!-- drop from Reproduce down to Develop -->
    <path d="M1140,246 L1140,426"/>
    <!-- row B chain (right→left): Develop → Verify → Canary → Deploy → Monitor -->
    <path d="M1040,478 L1004,478"/>
    <path d="M780,478 L644,478"/>
    <path d="M440,478 L414,478"/>
    <path d="M240,478 L214,478"/>
  </g>
  <!-- Verify PASS label -->
  <text x="712" y="470" font-size="12.5" font-weight="700" fill="#16a34a" text-anchor="middle">pass ▸</text>

  <!-- fail branch: Verify → back up to Develop -->
  <path d="M962,446 C1010,408 1070,408 1110,426" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrowFail)"/>
  <text x="1045" y="404" font-size="12.5" font-weight="700" fill="#dc2626" text-anchor="middle">fail — iterate</text>

  <!-- feedback loop: Monitor → back up to Intake (new reports / regressions) -->
  <path d="M40,470 C16,470 16,128 286,128 L380,128" fill="none" stroke="#9333ea" stroke-width="2.5" stroke-dasharray="2 6" marker-end="url(#arrowLoop)"/>
  <text x="150" y="300" font-size="13" font-weight="700" fill="#9333ea" transform="rotate(-90 150 300)" text-anchor="middle">new reports · regressions feed back</text>

  <!-- footer note -->
  <text x="640" y="690" text-anchor="middle" font-size="13" fill="#94a3b8">Every fix re-enters Verify before canary; production signal re-enters Intake — the loop never opens.</text>
</svg>
