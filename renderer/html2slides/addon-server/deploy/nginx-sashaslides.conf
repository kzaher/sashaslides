# /etc/nginx/sites-available/sashaslides.com
# Mirrors the api.holosweat.com pattern: nginx terminates TLS (certbot cert) and
# reverse-proxies to the localhost-bound sashaslides container. ADD-ONLY — this is
# a new site file; it does not touch any existing site.

# Port 80: ACME http-01 challenge + redirect everything else to https.
server {
    listen 80;
    listen [::]:80;
    server_name sashaslides.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 127.0.0.1:443 ssl;
    listen 78.46.91.212:443 ssl;
    server_name sashaslides.com;

    ssl_certificate     /etc/letsencrypt/live/sashaslides.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sashaslides.com/privkey.pem;

    # HTML fixtures + pptx round-trips can be sizeable.
    client_max_body_size 64M;

    # Long-cache the immutable UI/static + drawio assets; never cache the API.
    location /static/  { proxy_pass http://127.0.0.1:6000; include /etc/nginx/proxy_params; add_header Cache-Control "public, max-age=86400"; }
    location /drawio/  { proxy_pass http://127.0.0.1:6000; include /etc/nginx/proxy_params; add_header Cache-Control "public, max-age=86400"; }
    location /api/     { proxy_pass http://127.0.0.1:6000; include /etc/nginx/proxy_params; add_header Cache-Control "no-store"; }

    location / {
        proxy_pass http://127.0.0.1:6000;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
