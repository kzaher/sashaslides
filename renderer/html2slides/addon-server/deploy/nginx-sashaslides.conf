# /etc/nginx/sites-available/sashaslides.com
# Mirrors the api.holosweat.com pattern: nginx terminates TLS (certbot cert) and
# reverse-proxies to two localhost-bound containers. ADD-ONLY — this is a site file
# of its own; it does not touch any existing site.
#
#   127.0.0.1:6000  the website            (compose project `sashaslides`,     renderer/html2slides/addon-server)
#   127.0.0.1:6100  the Sasha Slides MCP   (compose project `sasha-connector`, mcp/sasha-slides/deploy)
#                   connector
#
# Routing contract (tested by nginx-routing.test.ts in this directory):
#   connector: /mcp, /register, /authorize, /token, /oauth/google/callback, /hooks/drive,
#              /comments/allow, /comments/allow/picker.js and /comments/access,
#              /v1/reports and /v1/reports/<id> (the add-on's defect reports, mcp/sasha-slides/reports),
#              /.well-known/{oauth-protected-resource,oauth-authorization-server,openid-configuration}[/mcp],
#              /account and /account/* (including the /account/reports admin pages), /connector/healthz (its /healthz), and the deck server:
#              /decks, /deck/*, /deck-app/*, /deck-api/* (WebSocket upgrades on /deck-api/sync/<id>)
#   website:   everything else, including /healthz (the site's own health check), /deckhouse
#              and /decks.css.

# The deck WebSocket (mcp/sasha-slides/decks/deck-socket.ts): forward an upgrade as an upgrade,
# and close a plain request's upstream connection as before.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Port 80: ACME http-01 challenge + redirect everything else to https.
server {
    listen 80;
    listen [::]:80;
    server_name sashaslides.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 127.0.0.1:443 ssl;
    listen 78.46.91.212:443 ssl;
    server_name sashaslides.com;

    ssl_certificate     /etc/letsencrypt/live/sashaslides.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sashaslides.com/privkey.pem;

    # HTML fixtures + pptx round-trips can be sizeable.
    client_max_body_size 64M;

    # ── Sasha Slides connector ────────────────────────────────────────────────
    # The three blocks below carry the same directives on purpose (nginx has no way to
    # share a directive set between locations short of an extra include file):
    #   • streaming: MCP answers over SSE and await_pick may hold a request for 3600 s,
    #     so buffering is off and the read timeout outlasts it.
    #   • identity: Host / X-Forwarded-* reach the connector; cookies pass untouched
    #     (the /account session cookie is `Path=/account; Secure; HttpOnly`).
    #   • no caching: OAuth, MCP and account responses are per-user.

    # MCP endpoint and the OAuth authorization server. The connector strips one trailing
    # slash, so `/mcp/` is the same endpoint as `/mcp`. `hooks/drive` takes Google Drive push
    # notifications for the comment bot (mcp/sasha-slides/comment-bot): no auth here, the
    # connector checks the channel id and token on every push. `comments/allow` is the comment
    # bot's per-deck Google Picker page and its script (comment-bot/comment-access-page.ts);
    # it carries the user's access token, hence no-store. `v1/reports` is the add-on's defect-report
    # intake (report-service/, mounted in the connector): CORS for the Apps Script sandbox, its own
    # caps and rate limit; its client address is the X-Forwarded-For entry set here.
    location ~ ^/(mcp|register|authorize|token|oauth/google/callback|hooks/drive|comments/allow|comments/allow/picker\.js|comments/access|v1/reports|v1/reports/[A-Za-z0-9_]+)/?$ {
        proxy_pass http://127.0.0.1:6100;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3700s;
        proxy_send_timeout 3700s;
        add_header Cache-Control "no-store" always;
    }

    # OAuth discovery documents (RFC 9728 / RFC 8414), at the base path and with the
    # resource path `/mcp` appended. Other /.well-known/ paths stay with the website,
    # and port 80 keeps /.well-known/acme-challenge/.
    location ~ ^/\.well-known/(oauth-protected-resource|oauth-authorization-server|openid-configuration)(/mcp)?/?$ {
        proxy_pass http://127.0.0.1:6100;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3700s;
        proxy_send_timeout 3700s;
        add_header Cache-Control "no-store" always;
    }

    # Account portal: sign in, erase my data, sign out, provider callbacks.
    location ~ ^/account(/|$) {
        proxy_pass http://127.0.0.1:6100;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3700s;
        proxy_send_timeout 3700s;
        add_header Cache-Control "no-store" always;
    }

    # The deck server inside the connector (SPEC.md 21.2, 21.15): the list page, the editor shell,
    # the web application's files, the JSON API and its WebSocket. Upgrade and Connection are
    # forwarded (the `map` above), the read timeout outlasts the 15-second heartbeats many times
    # over, and nothing here sets Cache-Control: the connector decides (no-store for the API,
    # immutable for /deck-app/ files) and an `add_header` would add a second, conflicting one.
    location ~ ^/(decks/?$|deck/|deck-app/|deck-api/) {
        proxy_pass http://127.0.0.1:6100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3700s;
        proxy_send_timeout 3700s;
    }

    # The connector's own /healthz, published under a name that does not collide with
    # the website's /healthz.
    location = /connector/healthz {
        proxy_pass http://127.0.0.1:6100/healthz;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }

    # ── website ───────────────────────────────────────────────────────────────
    # Long-cache the immutable UI/static + drawio assets; never cache the API.
    # Walkthrough videos: uploaded by `deploy/publish.sh videos` from the git-ignored
    # docs/connect/recording/recordings/, served straight from disk.
    location /videos/ {
        alias /var/www/sashaslides-videos/;
        types { video/mp4 mp4; }
        add_header Cache-Control "public, max-age=3600";
    }

    location /static/  { proxy_pass http://127.0.0.1:6000; include /etc/nginx/proxy_params; add_header Cache-Control "public, max-age=86400"; }
    location /drawio/  { proxy_pass http://127.0.0.1:6000; include /etc/nginx/proxy_params; add_header Cache-Control "public, max-age=86400"; }
    location /api/     { proxy_pass http://127.0.0.1:6000; include /etc/nginx/proxy_params; add_header Cache-Control "no-store"; }

    location / {
        proxy_pass http://127.0.0.1:6000;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
