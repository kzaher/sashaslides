# The sashaslides.com website, on the holosweat server behind its nginx and certbot certificate.
#
# This container speaks PLAIN HTTP on 127.0.0.1:${HOST_PORT} only (never exposed publicly); nginx
# terminates TLS and proxies to it (deploy/nginx-sashaslides.conf), and sends the connector's paths
# (/mcp, /account, /decks, /deck-api, ...) to the connector instead.
#
# Its own compose project and directory (/root/sashaslides). Built on the server by deploy/publish.sh.

services:
  sashaslides:
    image: holosweat-sashaslides:latest
    # Multi-stage build (Dockerfile): the builder stage runs native and the runtime stage is
    # `--platform=linux/amd64`, so the image matches the server without emulating the build. The
    # context is the REPOSITORY ROOT: the page bundles the product converter (mcp/sasha-slides) and
    # the pptxgenjs fork (deps/pptxgenjs) from source.
    build:
      context: ../../..
      dockerfile: renderer/html2slides/addon-server/Dockerfile
      args:
        BUILD_DATE: ${BUILD_DATE:-unknown}
    restart: unless-stopped
    environment:
      - PORT=8787
    # localhost-only publish: nginx on the host proxies to this, so no firewall opening is needed.
    ports:
      - "127.0.0.1:${HOST_PORT:-6000}:8787"
