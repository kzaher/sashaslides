<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         margin: 0; padding: 12px; color: #111; }
  p.sub { color: #666; margin: 0 0 12px; font-size: 12px; }
  #dropzone { display: block; border: 2px dashed #bbb; border-radius: 10px; padding: 20px 12px;
              text-align: center; color: #555; cursor: pointer; transition: all .15s; }
  .btn { display: inline-block; padding: 7px 12px; font: inherit; border: 1px solid #ccc;
         background: white; border-radius: 6px; cursor: pointer; }
  .btn:hover { background: #f3f4f6; }
  #dropzone.hover { border-color: #3b82f6; background: #eff6ff; color: #1d4ed8; }
  #dropzone strong { color: #111; }
  #picker { display: none; }
  .row { display: flex; gap: 8px; margin: 12px 0; align-items: center; flex-wrap: wrap; }
  button { padding: 7px 12px; font: inherit; border: 1px solid #ccc; background: white;
           border-radius: 6px; cursor: pointer; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.primary { background: #2563eb; color: white; border-color: #2563eb; }
  button.primary:disabled { background: #93c5fd; border-color: #93c5fd; }
  #file-list { margin: 0; padding: 0 0 0 20px; max-height: 110px; overflow: auto;
               font: 11px/1.5 ui-monospace, monospace; color: #444; }
  #file-list li { list-style: disc; }
  #progress-wrap { height: 6px; background: #eee; border-radius: 3px; overflow: hidden; margin: 6px 0; }
  #progress-bar { height: 100%; background: #2563eb; width: 0%; transition: width .15s; }
  #progress-label { font: 11px/1 ui-monospace, monospace; color: #666; min-height: 13px; }
  #log { font: 11px/1.45 ui-monospace, monospace; background: #0b1020; color: #cbd5e1;
         padding: 8px; border-radius: 6px; height: 160px; overflow: auto; margin-top: 8px; }
  #log .warn { color: #fbbf24; }
  #log .error { color: #f87171; }
  #paste-box { width: 100%; min-height: 44px; resize: vertical; margin: 8px 0 0;
               font: 11px/1.4 ui-monospace, monospace; color: #111;
               border: 1px solid #ccc; border-radius: 6px; padding: 6px 8px; }
  #paste-box:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 2px #bfdbfe; }
  body.dragging { outline: 3px dashed #3b82f6; outline-offset: -6px; }
  body.dragging #dropzone { border-color: #3b82f6; background: #eff6ff; color: #1d4ed8; }
  #trouble { margin: 8px 0 0; font-size: 12px; color: #666; }
  #trouble summary { cursor: pointer; }
  #notice { margin: 8px 0 0; }
  #notice .box { padding: 8px 10px; border-radius: 6px; font-size: 12px; line-height: 1.4; }
  #notice .warn { background: #fef3c7; border: 1px solid #fcd34d; color: #92400e; }
  #notice .ok { background: #dcfce7; border: 1px solid #86efac; color: #166534; }
  #notice a { color: #1d4ed8; font-weight: 600; }
</style>
</head>
<body tabindex="0">
<p class="sub">Upload, drop, or paste slide HTML. It's converted locally and inserted right after the current slide.</p>

<!-- Native <label for> opens the OS file dialog on a real click — a
     programmatic input.click() is blocked inside the Apps Script sandbox. -->
<label id="dropzone" for="picker">
  <strong>Click to browse, or drop .html slides here</strong><br>
  <span id="file-count">0</span> file(s) queued.
</label>
<input type="file" id="picker" accept=".html,.htm" multiple>

<div class="row">
  <label class="btn" for="picker">📂 Browse slide files…</label>
  <button id="paste-btn">📋 Paste from clipboard</button>
</div>

<textarea id="paste-box" placeholder="…or click here and press ⌘V / Ctrl+V to paste slide HTML"></textarea>

<ul id="file-list"></ul>

<div class="row">
  <button id="insert-btn" class="primary" disabled>Insert after current slide</button>
  <button id="clear-btn">Clear</button>
</div>

<div id="notice"></div>
<details id="trouble">
  <summary>Insert failing? (permissions)</summary>
  <div class="row">
    <button id="reauth-btn">🔐 Re-authorize</button>
    <button id="testperm-btn">🔎 Test permissions</button>
  </div>
</details>

<div id="progress-wrap"><div id="progress-bar"></div></div>
<div id="progress-label"></div>
<div id="log"></div>

      if (dist <= 4 && (!best || dist < best.dist)) best = { node: cands[i], dist };
    }
    if (best) return best.node;
    const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
    const list = idoc.elementsFromPoint?.(cx, cy) ?? [];
    for (const n of list) {
      if (n.tagName.toLowerCase() === tag) return n;
    }
    return list[0] || null;
  }
  async function processFile(file, log2, oversampling = 2) {
    const scale = clampOversampling(oversampling);
    log2(`  oversampling requested=${oversampling} \u2192 clamped scale=${scale}\xD7 (slide canvas ${SLIDE_W}\xD7${SLIDE_H}, full-slide visual would be ${SLIDE_W * scale}\xD7${SLIDE_H * scale}px)`);
    const html = await file.text();
    const iframe = await loadIntoIframe(html);
    try {
      const extraction = runExtractInIframe(iframe);
      if (!extraction || !extraction.elements) {
        throw new Error("extraction returned no elements");
      }
      log2(`  ${file.name}: ${extraction.elements.length} elements`);
      const visualPngs = await rasterizeVisuals(iframe, extraction, log2, scale);
      log2(`  ${file.name}: rasterized ${visualPngs.size} visuals`);
      return { extraction, visualPngs, name: file.name };
    } finally {
      iframe.remove();
    }
  }

  // browser/addon-main.ts
  function uiOversampling() {
    let v = 2;
    try {
      const b = window.h2s?.bridge?.oversampling;
      if (b) v = Number(b());
    } catch {
    }
    if (!Number.isFinite(v)) return 2;
    return Math.min(8, Math.max(1, v));
  }
  function gsCall(invoke) {
    return new Promise((resolve, reject) => {
      invoke(google.script.run.withSuccessHandler((v) => resolve(v)).withFailureHandler((e) => reject(e)));
    });
  }
  var $ = (sel) => document.querySelector(sel);
  var log = (msg, kind = "info") => {
    const logEl = $("#log");
    const line = document.createElement("div");
    line.className = kind;
    line.textContent = msg;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
    console[kind === "error" ? "error" : kind === "warn" ? "warn" : "log"](msg);
  };
  function setProgress(done, total, label = "") {
    const bar = $("#progress-bar");
    const pct = total ? Math.round(done / total * 100) : 0;
    bar.style.width = `${pct}%`;
    $("#progress-label").textContent = total ? `${done}/${total} ${label}` : "";
  }
  function bytesToBase642(bytes) {
    let bin = "";
    const CHUNK = 32768;
    for (let i = 0; i < bytes.length; i += CHUNK) {
      bin += String.fromCharCode.apply(null, Array.from(bytes.subarray(i, i + CHUNK)));
    }
    return btoa(bin);
  }
  function insertOnServer(base64, title) {
    return gsCall((r) => r.insertPptxAfterCurrent(base64, title));
  }
  function notice(html, kind) {
    $("#notice").innerHTML = `<div class="box ${kind}">${html}</div>`;
  }
  function offerReauth(url) {
    $("#trouble").open = true;
    notice(
      `Drive permission looks stale. <a href="${url}" target="_blank" rel="noopener">Re-authorize html2slides \u2197</a>, grant access (tick <b>Drive</b>), then click Insert again.`,
      "warn"
    );
    try {
      window.open(url, "_blank", "noopener");
    } catch {
    }
  }
  async function reauthorize() {
    try {
      const info = await gsCall((r) => r.getAuthInfo());
      log(`auth status: ${info.status}`);
      offerReauth(info.url);
    } catch (e) {
      log("could not fetch auth URL: " + e.message, "error");
    }
  }
  async function convertAndInsert(files) {
    files.sort((a, b) => a.name.localeCompare(b.name));
    $("#insert-btn").disabled = true;
    $("#log").innerHTML = "";
    log(`Converting ${files.length} slide(s)\u2026`);
    const oversampling = uiOversampling();
    if (oversampling !== 2) log(`oversampling: ${oversampling}\xD7`);
    const slides = [];
    setProgress(0, files.length, "extracting");
    for (let i = 0; i < files.length; i++) {
      log(`[${i + 1}/${files.length}] ${files[i].name}`);
      try {
        slides.push(await processFile(files[i], log, oversampling));
      } catch (e) {
        log(`  ${files[i].name}: extraction failed: ${e.message}`, "error");
      }
      setProgress(i + 1, files.length, "extracting");
    }
    if (slides.length === 0) {
      log("nothing to assemble \u2014 aborting", "error");
      $("#insert-btn").disabled = false;
      return;
    }
    log(`Assembling .pptx (${slides.length} slide(s))\u2026`);
    setProgress(0, 1, "building pptx");
    const title = files[0].name.replace(/\.html?$/i, "") + (files.length > 1 ? "-deck" : "");
    const bytes = await buildPptxInMemory(slides, title);
    setProgress(1, 1, "inserting");
    log(`pptx built: ${bytes.byteLength.toLocaleString()} bytes \u2014 inserting into deck\u2026`);
    try {
      const r = await insertOnServer(bytesToBase642(bytes), title);
      log(`\u2713 inserted ${r.inserted} slide(s) after the current slide (now at position ${r.at}).`);
      notice(`\u2713 inserted ${r.inserted} slide(s).`, "ok");
      filesState.length = 0;
      renderFileList();
    } catch (e) {
      const msg = e.message || String(e);
      log(`insert failed: ${msg}`, "error");
      if (/PERMISSION_DENIED|permission|authoriz|storage/i.test(msg)) {
        await reauthorize();
      }
    } finally {
      $("#insert-btn").disabled = filesState.length === 0;
    }
  }
  var filesState = [];
  var pasteCounter = 0;
  function renderFileList() {
    const list = $("#file-list");
    list.innerHTML = "";
    for (const f of filesState) {
      const li = document.createElement("li");
      li.textContent = `${f.name} (${(f.size / 1024).toFixed(1)} KB)`;
      list.appendChild(li);
    }
    $("#insert-btn").disabled = filesState.length === 0;
    $("#file-count").textContent = String(filesState.length);
  }
  function addFiles(files) {
    let added = 0;
    for (const f of Array.from(files)) {
      if (!/\.html?$/i.test(f.name)) continue;
      if (filesState.some((g) => g.name === f.name && g.size === f.size)) continue;
      filesState.push(f);
      added++;
    }
    renderFileList();
    return added;
  }
  function addPastedHtml(content) {
    const trimmed = (content || "").trim();
    if (!trimmed) return;
    const name = `pasted_${String(++pasteCounter).padStart(2, "0")}.html`;
    addFiles([new File([content], name, { type: "text/html" })]);
    log(`pasted content as ${name} (${trimmed.length} chars)`);
  }
  async function pasteFromClipboard() {
    const nav = navigator;
    try {
      if (nav.clipboard?.read) {
        const items = await nav.clipboard.read();
        let got = false;
        for (const it of items) {
          const type = it.types.includes("text/html") ? "text/html" : it.types.includes("text/plain") ? "text/plain" : null;
          if (!type) continue;
          const blob = await it.getType(type);
          const txt = await blob.text();
          if (txt.trim()) {
            addPastedHtml(txt);
            got = true;
          }
        }
        if (got) return;
      }
      if (nav.clipboard?.readText) {
        const txt = await nav.clipboard.readText();
        if (txt.trim()) {
          addPastedHtml(txt);
          return;
        }
      }
      log("clipboard had no HTML/text \u2014 click the paste box and press \u2318V / Ctrl+V", "warn");
      $("#paste-box").focus();
    } catch {
      log("clipboard read was blocked \u2014 click the paste box and press \u2318V / Ctrl+V instead", "warn");
      $("#paste-box").focus();
    }
  }
  function extractPaste(dt) {
    const pastedFiles = Array.from(dt.files || []).filter((f) => /\.html?$/i.test(f.name));
    if (pastedFiles.length) {
      addFiles(pastedFiles);
      log(`pasted ${pastedFiles.length} file(s): ${pastedFiles.map((f) => f.name).join(", ")}`);
      return true;
    }
    const html = dt.getData("text/html");
    const text = dt.getData("text/plain");
    const content = html || text;
    if (content.trim()) {
      addPastedHtml(content);
      return true;
    }
    return false;
  }
  function init() {
    const drop = $("#dropzone");
    const picker = $("#picker");
    const pasteBox = $("#paste-box");
    let dragDepth = 0;
    document.addEventListener("dragenter", (e) => {
      e.preventDefault();
      dragDepth++;
      document.body.classList.add("dragging");
    });
    document.addEventListener("dragover", (e) => {
      e.preventDefault();
      if (e.dataTransfer) e.dataTransfer.dropEffect = "copy";
    });
    document.addEventListener("dragleave", (e) => {
      e.preventDefault();
      if (--dragDepth <= 0) {
        dragDepth = 0;
        document.body.classList.remove("dragging");
      }
    });
    document.addEventListener("drop", (e) => {
      e.preventDefault();
      dragDepth = 0;
      document.body.classList.remove("dragging");
      if (e.dataTransfer?.files?.length) {
        const n = addFiles(e.dataTransfer.files);
        log(n ? `added ${n} file(s) by drop` : "dropped item(s) had no .html files", n ? "info" : "warn");
      }
    });
    void drop;
    picker.addEventListener("click", () => {
      picker.value = "";
    });
    picker.addEventListener("change", () => {
      if (picker.files) addFiles(picker.files);
    });
    $("#paste-btn").addEventListener("click", () => {
      pasteFromClipboard();
    });
    pasteBox.addEventListener("paste", (e) => {
      const dt = e.clipboardData;
      if (dt && extractPaste(dt)) {
        e.preventDefault();
        pasteBox.value = "";
      }
    });
    document.addEventListener("paste", (e) => {
      const t = e.target;
      if (t === pasteBox) return;
      if (t && (t.isContentEditable || /^(input|textarea|select)$/i.test(t.tagName))) return;
      if (e.clipboardData && extractPaste(e.clipboardData)) e.preventDefault();
    });
    $("#insert-btn").addEventListener("click", () => {
      convertAndInsert(filesState.slice()).catch((e) => {
        log("conversion crashed: " + e.message, "error");
        $("#insert-btn").disabled = false;
      });
    });
    $("#clear-btn").addEventListener("click", () => {
      filesState.length = 0;
      renderFileList();
      $("#log").innerHTML = "";
      $("#notice").innerHTML = "";
      setProgress(0, 0);
    });
    $("#reauth-btn").addEventListener("click", () => {
      reauthorize();
    });
    $("#testperm-btn").addEventListener("click", async () => {
      notice("Testing Drive access\u2026", "warn");
      try {
        const r = await gsCall((rr) => rr.testDriveAccess());
        notice(`\u2713 Drive access works (as ${r.user || "your account"}). If Insert still fails it's likely a transient Google error \u2014 try Insert again.`, "ok");
        log("Drive permission test: OK");
      } catch (e) {
        const msg = e.message || String(e);
        log("Drive permission test failed: " + msg, "error");
        await reauthorize();
      }
    });
    renderFileList();
    try {
      pasteBox.focus();
    } catch {
    }
    log("ready. Upload / drop / paste slide HTML, then Insert.");
    if (typeof google !== "undefined" && !window.PptxGenJS) {
      log("loading converter libraries\u2026", "info");
    }
    detectAccountAndWarn();
  }
  function parseAuthUser(s) {
    if (!s) return null;
    const m = s.match(/-(\d+)lu-script\.googleusercontent/) || s.match(/[?&]authuser=(\d+)/) || s.match(/\/u\/(\d+)(?:\/|\b)/);
    return m ? parseInt(m[1], 10) : null;
  }
  function warnNonDefaultAccount(idx) {
    try {
      $("#trouble").open = true;
    } catch {
    }
    const who = idx != null && idx !== 0 ? `a non-default account (authuser=${idx})` : "a non-default Google account";
    notice(
      `\u26A0 <b>html2slides can't reach its server</b> \u2014 you're on ${who}. Google's add-on multi-login bug blocks server calls (PERMISSION_DENIED) on every account except your <b>default (u/0)</b>. Open this deck under your default Google account (or install the add-on), then reopen html2slides.`,
      "warn"
    );
    log(`\u26A0 non-default account detected (authuser=${idx == null ? "?" : idx}) \u2014 server calls will fail`, "warn");
  }
  function detectAccountAndWarn() {
    const signals = {
      href: location.href,
      referrer: document.referrer || "",
      ancestors: (() => {
        try {
          return Array.from(location.ancestorOrigins || []).join(" ");
        } catch {
          return "";
        }
      })(),
      name: window.name || ""
    };
    let idx = null;
    for (const v of Object.values(signals)) {
      const p = parseAuthUser(v);
      if (p != null) {
        idx = p;
        break;
      }
    }
    log(`authuser detect: index=${idx == null ? "?" : idx}`, "info");
    if (idx != null && idx !== 0) {
      warnNonDefaultAccount(idx);
      return;
    }
    if (idx == null) {
      gsCall((r) => r.getAuthInfo()).catch((e) => {
        const msg = e?.message || String(e);
        if (/PERMISSION_DENIED|storage|permission|authoriz/i.test(msg)) warnNonDefaultAccount(null);
      });
    }
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();

</script>
</body>
</html>
