<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="c3t">
<title id="c3t">Sasha Slides - Flock Pen (slides as sheep herded into a corral)</title>
<desc>Two paints only: currentColor (foreground) plus the CSS custom property --sasha-accent. Holes are true negative space, so they always equal the page background. Light wrapper: color:#1E1B3A; --sasha-accent:#6C4BF4; on paper #FFF8F0. Dark wrapper: color:#FFF8F0; --sasha-accent:#19D3C5; on night #0D0F1C.</desc>
<defs>
  <g id="sheep">
    <circle cx="24" cy="22" r="16" fill="var(--sasha-accent,#6C4BF4)"/>
    <circle cx="52" cy="14" r="17" fill="var(--sasha-accent,#6C4BF4)"/>
    <circle cx="80" cy="22" r="16" fill="var(--sasha-accent,#6C4BF4)"/>
    <rect x="0" y="20" width="100" height="44" rx="11" fill="var(--sasha-accent,#6C4BF4)"/>
    <rect x="16" y="60" width="14" height="20" rx="7" fill="currentColor"/>
    <rect x="64" y="60" width="14" height="20" rx="7" fill="currentColor"/>
    <path d="M92 24c6-14 22-14 28-2 12 2 18 14 14 26-4 14-20 20-32 12-10-8-16-24-10-36Z" fill="currentColor"/>
  </g>
</defs>
<path d="M126 44h116v168H126" fill="none" stroke="currentColor" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="2" y="104" width="40" height="14" rx="7" fill="currentColor"/>
<use href="#sheep" transform="translate(130 94) scale(0.78)"/>
<use href="#sheep" transform="translate(34 128) scale(0.6)"/>
<use href="#sheep" transform="translate(2 176) scale(0.42)"/>
</svg>
