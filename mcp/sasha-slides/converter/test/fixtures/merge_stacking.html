<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- A MERGE candidate: only the new parts, on a transparent page. The panel goes behind the slide's
     existing content (z-index -1), the bar has no z-index (in front), and the badge is raised to 3;
     the badge's own child says -7, which orders it inside the badge only, so it stacks at 3. -->
<style>
  html, body { margin: 0; width: 1280px; height: 720px; }
  body { position: relative; }
  .panel { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; background: #f0f0f0; z-index: -1; }
  .bar { position: absolute; left: 100px; top: 100px; width: 300px; height: 100px; background: #1e88e5; }
  .badge { position: absolute; left: 900px; top: 40px; width: 100px; height: 100px; background: #e53935; z-index: 3; }
  .dot { position: absolute; left: 10px; top: 10px; width: 20px; height: 20px; background: #ffffff; z-index: -7; }
</style>
</head>
<body>
  <div class="panel"></div>
  <div class="bar"></div>
  <div class="badge"><div class="dot"></div></div>
</body>
</html>
