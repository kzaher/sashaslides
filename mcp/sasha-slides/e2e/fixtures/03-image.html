  <div>
    <h1>The HTML is authoritative</h1>
    <p>
      The rendered slide is a lossy projection. The user toggles between them and
      files anomalies against whichever one lies.
    </p>
    <p>A raster embedded as a <code>data:</code> URI keeps the slide self-contained &mdash;
      no network fetch at convert time.</p>
